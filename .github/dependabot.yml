version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    assignees:
      - "koppreshk"
    reviewers:
      - "koppreshk"
    labels:
      - "dependencies"
      - "npm"
    # Security updates configuration
    allow:
      - dependency-type: "direct"
        dependency-name: "*"
    # Version update strategy
    versioning-strategy:
      increase: "patch"
    # Ignore specific dependencies if needed
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]  # Ignores major version updates